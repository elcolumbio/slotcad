[project]
name = "slotcad"
version = "0.1.0"
description = "Measure real T-slot geometry from vendor STEP and compile topologies into cut lists"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "elcolumbio" }]
dependencies = [
    # STEP import, cross-section metrology, optional solid boolean interference
    "cadquery>=2.4",
]

[project.optional-dependencies]
dev = [
    # test runner used by `make test`
    "pytest>=8.0",
]

[project.scripts]
slotcad = "slotcad.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
